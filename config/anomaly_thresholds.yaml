# Python anomaly checks. All thresholds live here, none in code.

# Neighbours = channels sharing these metadata attributes. [height] compares a
# channel with every channel at the same height across rows and sides. Needs
# at least 3 channels per group; with 2 you cannot tell which one is wrong.
neighbour_group_by: [height]

flatline:
  window_s: 600                 # rolling window for standard deviation
  max_std_degC: 0.02            # channel std below this = not moving
  neighbour_min_std_degC: 0.1   # neighbours' median std above this = they are moving
  frozen_max_std_degC: 0.005    # channel std below this = no sensor noise at all...
  neighbour_noise_floor_degC: 0.02  # ...while neighbours' median std shows noise above this
  min_duration_s: 600

drift:
  # Offset = channel minus median of the other neighbours. Its median over the
  # reference window is the baseline; drift = change from that baseline.
  # Either {phase: stabilised, first_min: 10} or absolute {start_min: 60, end_min: 70}.
  reference_window: {phase: stabilised, first_min: 10}
  smoothing_s: 120              # rolling mean on the offset, rejects noise and spikes
  threshold_degC: 1.5           # |offset change| above this...
  min_duration_s: 900           # ...for at least this long

spike:
  baseline_window_s: 600        # centred rolling median; must be much longer than a spike
  threshold_degC: 2.0           # |channel - baseline|
  max_duration_s: 300           # longer excursions are steps or drift, not spikes
  recovery_window_s: 60         # fit the trend this long before; after must match it...
  recovery_tolerance_degC: 1.0  # ...within this, or it is a step, not a spike

missing:
  max_gap_factor: 1.5           # time step > factor x median step = gap in logging
  min_nan_run_samples: 1

# Stage A: channels with these anomaly types overlapping a metric window are
# "suspect". Every affected metric is computed with and without them.
suspect_types: [flatline, drift]
# false (default): flag only. Criteria use all channels; if the two verdicts
#   differ the status is REVIEW_REQUIRED.
# true: criteria use the value with suspect channels excluded.
auto_exclude: false
