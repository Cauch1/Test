# Location metadata per standard channel name.
# Add to this when the YAML channel matching adds a new standard name.
channels:
  tc_r1_l_foot: {unit: degC, height: foot, row: 1, side: left, sensor_range: [-40, 150]}
  tc_r1_l_breath: {unit: degC, height: breath, row: 1, side: left, sensor_range: [-40, 150]}
  tc_r1_l_head: {unit: degC, height: head, row: 1, side: left, sensor_range: [-40, 150]}
  tc_r1_r_foot: {unit: degC, height: foot, row: 1, side: right, sensor_range: [-40, 150]}
  tc_r1_r_breath: {unit: degC, height: breath, row: 1, side: right, sensor_range: [-40, 150]}
  tc_r1_r_head: {unit: degC, height: head, row: 1, side: right, sensor_range: [-40, 150]}
  tc_r2_l_foot: {unit: degC, height: foot, row: 2, side: left, sensor_range: [-40, 150]}
  tc_r2_l_breath: {unit: degC, height: breath, row: 2, side: left, sensor_range: [-40, 150]}
  tc_r2_l_head: {unit: degC, height: head, row: 2, side: left, sensor_range: [-40, 150]}
  tc_r2_r_foot: {unit: degC, height: foot, row: 2, side: right, sensor_range: [-40, 150]}
  tc_r2_r_breath: {unit: degC, height: breath, row: 2, side: right, sensor_range: [-40, 150]}
  tc_r2_r_head: {unit: degC, height: head, row: 2, side: right, sensor_range: [-40, 150]}
