[project]
name = "posttest-interpret"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "pydantic>=2", "pyyaml", "anthropic>=2.3", "python-pptx", "python-docx"]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
